<!doctype html>
<html lang="en" data-theme="neutralized">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Neutral CUBE fixture</title><link rel="stylesheet" href="./fixture.css">
</head>
<body>
  <main class="nbr-u-wrapper nbr-stack">
    <h1>Neutral CUBE fixture</h1>
    <p class="nbr-u-visually-hidden">CSS-only onboarding evidence.</p>
    <p class="fixture-note">Native semantics, finite composition hooks, and product-owned theme scope.</p>
    <section class="nbr-surface nbr-stack" data-nbr-level="outlined" data-nbr-shadow-direction="fixed">
      <h2>Stack and Cluster</h2>
      <div class="nbr-cluster" dir="rtl" style="--nbr-cluster-gap: var(--nbr-space-2)">
        <button class="nbr-button" type="button">Primary action</button>
        <a class="nbr-button" href="#field">Native link</a>
      </div>
    </section>
    <form id="field" class="nbr-field nbr-stack" novalidate>
      <label for="email">Email</label>
      <input id="email" name="email" type="email" required aria-describedby="email-help">
      <p id="email-help" data-nbr-description>Required for the local example.</p>
      <button class="nbr-button" type="submit">Submit</button>
    </form>
  </main>
</body>
</html>
