name: Deploy docs to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

env:
  NODE_VERSION: '26'
  PNPM_VERSION: '11.24.0'
  PUBLIC_SITE_BASE: /neobrui/
  PUBLIC_SITE_URL: https://tekgadgt.github.io/neobrui/

jobs:
  verify:
    name: Required build and test gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/configure-pages@v6
      - run: pnpm release:local
      - run: (cd dist/release && sha256sum -c SHA256SUMS)
      - run: pnpm prepare:docs
      - run: pnpm exec astro check --root apps/docs
      - run: pnpm build:fixtures
      - run: pnpm build:docs
      - run: pnpm build:docs:pages
      - run: pnpm verify:pages
      - run: pnpm exec node --test tests/*.test.mjs
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/docs/dist

  browsers:
    name: Playwright (${{ matrix.browser }})
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install frozen root dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - name: Build Pages docs for matching base
        run: pnpm build:docs:pages
      - name: Run root browser coverage
        run: pnpm exec playwright test --project=${{ matrix.browser }}
      - name: Run docs browser coverage
        run: PUBLIC_SITE_BASE=/neobrui/ PUBLIC_SITE_URL=https://tekgadgt.github.io/neobrui/ pnpm --dir apps/docs exec playwright test --config=playwright.config.js --project=${{ matrix.browser }}

  deploy:
    name: Publish Pages artifact
    needs:
      - verify
      - browsers
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
