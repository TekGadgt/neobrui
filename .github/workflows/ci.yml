name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '26'
  PNPM_VERSION: '11.24.0'
  PUBLIC_SITE_BASE: /neobrui/
  PUBLIC_SITE_URL: https://tekgadgt.github.io/neobrui/

jobs:
  verify:
    name: Build and contract checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install frozen root dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify deterministic release and checksum
        run: |
          pnpm release:local
          (cd dist/release && sha256sum -c SHA256SUMS)
      - name: Prepare docs artifact
        run: pnpm prepare:docs
      - name: Astro type and content check
        run: pnpm exec astro check --root apps/docs
      - name: Build root fixtures
        run: pnpm build:fixtures
      - name: Build docs with root base
        run: pnpm build:docs
      - name: Build and validate Pages output
        run: |
          pnpm build:docs:pages
          pnpm verify:pages
      - name: Focused contract tests
        run: pnpm exec node --test tests/*.test.mjs

  browsers:
    name: Playwright (${{ matrix.browser }})
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install frozen root dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - name: Run full browser contract matrix
        run: pnpm exec playwright test --project=${{ matrix.browser }}
