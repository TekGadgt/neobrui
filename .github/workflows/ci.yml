name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '26'
  PNPM_VERSION: '11.24.0'

jobs:
  verify:
    name: Build and contract checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm pack:smoke
      - run: pnpm --filter neobrui-docs check
      - run: pnpm --filter neobrui-docs build:root
      - run: PUBLIC_SITE_BASE=/neobrui/ PUBLIC_SITE_URL=https://tekgadgt.github.io/neobrui/ pnpm --filter neobrui-docs build:pages

  browsers:
    name: Docs Playwright (${{ matrix.site }}, ${{ matrix.browser }})
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        site: [root, pages]
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - name: Build current Starlight artifact
        run: |
          if [ "${{ matrix.site }}" = "pages" ]; then
            PUBLIC_SITE_BASE=/neobrui/ PUBLIC_SITE_URL=https://tekgadgt.github.io/neobrui/ pnpm --filter neobrui-docs build:pages
          else
            pnpm --filter neobrui-docs build:root
          fi
      - name: Run docs-local Playwright
        run: |
          if [ "${{ matrix.site }}" = "pages" ]; then
            PUBLIC_SITE_BASE=/neobrui/ pnpm --filter neobrui-docs test --project=${{ matrix.browser }}
          else
            pnpm --filter neobrui-docs test --project=${{ matrix.browser }}
          fi
